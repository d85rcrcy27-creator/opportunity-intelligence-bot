version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "d85rcrcy27-creator"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps):"
    pull-request-branch-name:
      separator: "/"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "d85rcrcy27-creator"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "d85rcrcy27-creator"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci:"
